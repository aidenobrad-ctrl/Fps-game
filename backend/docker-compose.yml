# PostgreSQL and Redis for running the backend and its tests on your own machine.
#   docker compose up -d      start them
#   docker compose down       stop them (data is kept)
#   docker compose down -v    stop them and delete the data
# The credentials match appsettings.Development.json and the test defaults. They are for
# local development only.
name: recoil

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: recoil
      POSTGRES_PASSWORD: recoil_dev
      POSTGRES_DB: recoil
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recoil-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoil"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  # Named for the game, so a database made before the rename (with other credentials) is not reused.
  recoil-postgres:
